[project]
name = "docforge-core"
version = "0.1.0"
description = "文枢 DocForge 文档处理内核（本地服务）"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "psutil>=6.1",
    "Pillow>=11.0",
]

[project.optional-dependencies]
# PDF 与 Office 处理（M5 / M6 里程碑使用）
docs = ["PyMuPDF>=1.24", "pypdf>=5.1", "pdf2docx>=0.5.8", "python-docx>=1.1", "openpyxl>=3.1", "python-pptx>=1.0"]
# 本地离线 OCR（对应需求 8 的"保留本地部署选项"，体积较大故设为可选）
ocr = ["rapidocr-onnxruntime>=1.4", "onnxruntime>=1.20", "opencv-python-headless>=4.10", "numpy>=2.0"]
# Windows 高保真转换（Word/Excel/PPT COM 自动化）
windows-com = ["pywin32>=308"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docforge"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# 把 core/ 加进导入路径（相对 rootdir 解析，即本文件所在目录）。
#
# 少了这一行，`pytest core/tests`（从仓库根执行，也就是 `pnpm core:test`
# 干的事）会因为 CWD 是仓库根而找不到 docforge 包，13 个测试文件全部
# collection error。之所以在 core/ 下手敲 pytest 一直是好的，是因为
# `python -m pytest` 会把 CWD 塞进 sys.path —— 本机测试时恰好掩盖了这个问题。
pythonpath = ["."]
